name: Lane A checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Check and build the app
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run ci
      - name: Verify project evidence
        run: |
          python3 scripts/criteria_check.py
          python3 scripts/verify_handoff.py
          python3 scripts/financial_model.py
      - name: Audit runtime dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Scan source for credentials
        run: |
          scan_dir="$(mktemp -d)"
          git ls-files -z | tar --null --files-from=- -cf - | tar -C "$scan_dir" -xf -
          docker run --rm -v "$scan_dir:/work:ro" zricethezav/gitleaks:v8.30.1 dir /work --no-banner --redact=100
      - name: Scan TypeScript and Next.js source
        run: |
          docker run --rm -v "${{ github.workspace }}:/src:ro" semgrep/semgrep:1.149.0 semgrep scan --disable-version-check --metrics=off --config p/typescript --config p/nextjs --error web/src web/worker
