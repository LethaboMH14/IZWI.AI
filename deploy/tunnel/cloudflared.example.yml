# Replace placeholders with the team-owned DNS zone and a dedicated Access application.
tunnel: <tunnel-uuid>
credentials-file: 'C:\Users\<operator>\.cloudflared\<tunnel-uuid>.json'

ingress:
  - hostname: studio.<team-zone>
    service: http://127.0.0.1:3187
    originRequest:
      access:
        required: true
        teamName: <access-team-name>
        audTag:
          - <studio-access-audience>
  - hostname: consent.<team-zone>
    path: ^/c/[A-Za-z0-9_-]{20,64}$
    service: http://127.0.0.1:3187
  - hostname: consent.<team-zone>
    path: ^/api/public/consent/[A-Za-z0-9_-]{20,64}$
    service: http://127.0.0.1:3187
  - hostname: consent.<team-zone>
    path: ^/api/media/[a-z]+_[A-Za-z0-9]+$
    service: http://127.0.0.1:3187
  - hostname: consent.<team-zone>
    path: ^/_next/static/
    service: http://127.0.0.1:3187
  - service: http_status:404
